<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LobsterAI</title>
    <script>
      // 在页面加载前预设主题，避免闪烁
      // 注意：必须保留 inline backgroundColor，因为 CSS 变量在样式表加载前不可用
      (function() {
        try {
          var THEME_COLORS = { dark: '#0F1117', light: '#F8F9FB' };
          var savedConfig = localStorage.getItem('app_config');
          var theme = 'system';
          if (savedConfig) {
            var config = JSON.parse(savedConfig);
            theme = config.theme || 'system';
          }

          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          document.documentElement.classList.add(theme);
          document.documentElement.style.backgroundColor = THEME_COLORS[theme] || THEME_COLORS.light;
        } catch (e) {
          console.error('Error applying theme early:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
